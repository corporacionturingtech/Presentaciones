<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reportes al aeropuerto · Prototipo para Ecuacentair</title>
<meta name="description" content="Prototipo elaborado por Turingtech: del Excel del proveedor contable al reporte de ventas del aeropuerto, revisado y listo en un clic. Datos ilustrativos.">
<!--
  Prototipo para Ecuacentair Cia Ltda (reunión 2, 4 de noviembre de 2026).
  Fuente: turingtech-docs/comercial/Ecuasentair/mockup_ecuacentair_reportes.html
  Copia publicada: repo Presentaciones, mockup-ecuacentair-reportes.html (GitHub Pages).
  Todo es ilustrativo: operadores, matrículas, servicios, precios unitarios y columnas del reporte.
  Las cifras salen del bloque DATA y se calculan; ninguna se escribe a mano.
-->
<style>
:root{
  --c-primary:#0055B8; --c-primary-dk:#003F8A; --c-accent:#0099CC; --c-ink:#000033;
  --c-text:#1E2433; --c-muted:#5B6474; --c-border:#D9E0EA; --c-bg:#F4F7FB; --c-white:#FFFFFF;
  --c-ok:#1A7F4B; --c-ok-bg:#E6F4EC; --c-warn:#A15C00; --c-warn-bg:#FFF4E0; --c-bad:#B42318; --c-bad-bg:#FDECEA;
  --c-soft:#E8F1FB;
  --f-body: Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
  --f-head: "Segoe UI", "Noto Sans", "DejaVu Sans", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);color:var(--c-text);background:var(--c-bg);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);color:var(--c-ink);margin:0}

/* Barra superior */
.top{background:var(--c-white);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.top img{height:48px;width:auto;display:block}
.top .ttl{display:flex;flex-direction:column;min-width:0}
.top .ttl b{font-family:var(--f-head);font-size:17px;color:var(--c-ink)}
.top .ttl span{font-size:12.5px;color:var(--c-muted)}
.top .sp{flex:1}
.badge-proto{background:var(--c-ink);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:4px;white-space:nowrap}
.btn-ghost{background:none;border:1px solid var(--c-border);color:var(--c-muted);border-radius:6px;padding:6px 12px;font-size:13px}
.btn-ghost:hover{border-color:var(--c-primary);color:var(--c-primary)}

/* Franja de entrega */
.due{background:var(--c-ink);color:#fff;padding:8px 20px;font-size:13.5px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.due b{color:#7FD3F0}

/* Indicador de pasos */
.steps{position:sticky;top:0;z-index:20;background:var(--c-white);border-bottom:1px solid var(--c-border);padding:10px 20px;display:flex;gap:6px;overflow-x:auto}
.st{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid transparent;background:none;color:var(--c-muted);font-size:14px;white-space:nowrap}
.st .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c-bg);border:1px solid var(--c-border);font-weight:700;font-size:13px;flex:none}
.st.on{color:var(--c-ink);border-color:var(--c-primary);background:var(--c-soft);font-weight:700}
.st.on .n{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.st.done .n{background:var(--c-ok);border-color:var(--c-ok);color:#fff}
.st:disabled{opacity:.5;cursor:default}

/* Contenido */
main{max-width:1180px;margin:0 auto;padding:22px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.card{background:var(--c-white);border:1px solid var(--c-border);border-radius:10px;padding:22px;min-width:0}
.step-head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.step-head .k{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--c-accent);text-transform:uppercase}
.step-head h2{font-size:24px}
.step-head p{margin:0;color:var(--c-muted);max-width:760px}

.ba{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--c-border);border-radius:8px;overflow:hidden;margin-bottom:18px}
.ba div{padding:10px 14px;font-size:14px}
.ba .antes{background:#F6F6F8;color:#4A4F5C}
.ba .ahora{background:var(--c-soft);color:var(--c-ink)}
.ba b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.ba .antes b{color:#8A8F9C}
.ba .ahora b{color:var(--c-primary)}

.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--c-border)}
.actions .sp{flex:1}
.btn{background:var(--c-primary);color:#fff;border:none;border-radius:8px;padding:12px 20px;font-weight:700;font-size:15px}
.btn:hover{background:var(--c-primary-dk)}
.btn.sec{background:var(--c-white);color:var(--c-primary);border:1px solid var(--c-primary)}
.btn.sec:hover{background:var(--c-soft)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:none;color:var(--c-primary);text-decoration:underline;padding:0;font-size:14px}
.hint{font-size:13px;color:var(--c-muted)}

/* Paso 1: archivo */
.drop{border:2px dashed #9DB7D9;border-radius:10px;padding:26px;display:flex;gap:18px;align-items:center;background:#FAFCFF;flex-wrap:wrap}
.xls-ic{width:54px;height:62px;flex:none;border-radius:6px;background:#1D6F42;color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;position:relative}
.xls-ic:after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent #FAFCFF transparent transparent}
.drop .info{flex:1;min-width:200px}
.drop .info b{font-size:16px;color:var(--c-ink)}
.drop .info div{font-size:13.5px;color:var(--c-muted)}
.sheet{border:1px solid var(--c-border);border-radius:8px;overflow:hidden;margin-top:16px}
.sheet-body{overflow:auto;max-height:360px}
.tabs-x{display:flex;background:#F0F2F5;border-top:1px solid var(--c-border);overflow-x:auto}
.tabs-x button{border:none;border-right:1px solid var(--c-border);background:none;padding:8px 14px;font-size:13px;color:var(--c-muted);white-space:nowrap}
.tabs-x button.on{background:#fff;color:#1D6F42;font-weight:700;box-shadow:inset 0 -3px 0 #1D6F42}
.tabs-x button small{color:#8A8F9C;font-weight:400}

table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:#F0F4FA;color:var(--c-ink);text-align:left;font-weight:700;padding:7px 9px;border-bottom:1px solid var(--c-border);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:6px 9px;border-bottom:1px solid #EEF1F5;white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.more td{color:var(--c-muted);font-style:italic;text-align:center}
table.t tr.tot td{font-weight:700;background:#F6F9FD;border-top:2px solid var(--c-border)}
table.t td.flag{background:var(--c-warn-bg);color:var(--c-warn);font-weight:700}
table.t td.bad{background:var(--c-bad-bg);color:var(--c-bad);font-weight:700}
table.t tr.hl td{background:#FFF9DB}
.xl th{background:#E9EEF3!important;font-weight:600!important;color:#333!important}

/* Paso 2: unir */
.merge{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:18px}
.merge .arrow{font-size:34px;color:var(--c-accent);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:90px;align-content:center;position:relative}
.chip{background:#fff;border:1px solid var(--c-border);border-left:4px solid #1D6F42;border-radius:6px;padding:8px 12px;font-size:13.5px;transition:transform .7s ease, opacity .7s ease}
.chip small{display:block;color:var(--c-muted);font-size:12px}
.one{border:2px solid var(--c-primary);border-radius:8px;padding:14px;text-align:center;background:var(--c-soft);opacity:.35;transition:opacity .5s ease}
.one.on{opacity:1}
.one b{font-size:16px;color:var(--c-ink);display:block}
.merged .chip{transform:scale(.85);opacity:.35}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;margin:6px 0 18px}
.cmp h3{font-size:14.5px;margin-bottom:6px}
.cmp .box{border:1px solid var(--c-border);border-radius:8px;overflow:auto}
.cmp .cap{font-size:12.5px;color:var(--c-muted);margin-top:6px}
.fade-in{animation:fi .45s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}

/* Paso 3: revisar */
.rev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px}
.rev h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cnt{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.cnt.ok{background:var(--c-ok-bg);color:var(--c-ok)}
.cnt.wa{background:var(--c-warn-bg);color:var(--c-warn)}
ul.auto{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.auto li{display:flex;gap:10px;font-size:14px;background:var(--c-ok-bg);border-radius:8px;padding:10px 12px}
ul.auto li i{font-style:normal;color:var(--c-ok);font-weight:800}
.aviso{border:1px solid #F0D29E;background:var(--c-warn-bg);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.aviso.ok{border-color:#A9D8BC;background:var(--c-ok-bg)}
.aviso .h{display:flex;gap:8px;align-items:flex-start;font-weight:700;color:var(--c-ink)}
.aviso .h i{font-style:normal;color:var(--c-warn)}
.aviso.ok .h i{color:var(--c-ok)}
.aviso p{margin:4px 0 8px 22px;font-size:13.5px;color:#4A4F5C}
.aviso .do{margin-left:22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aviso input{border:1px solid var(--c-border);border-radius:6px;padding:7px 9px;font:inherit;font-size:14px;width:130px}
.aviso .res{margin-left:22px;font-size:13.5px;color:var(--c-ok);font-weight:700}
.cuadre{margin-top:18px;border:1px solid var(--c-border);border-radius:8px;overflow:auto}
.cuadre .t td.dz{color:var(--c-ok);font-weight:700}
.cuadre .t td.dn{color:var(--c-bad);font-weight:700}
.cuadre-cap{font-size:12.5px;color:var(--c-muted);padding:8px 10px;background:#FAFBFD}

/* Paso 4: reporte */
.seg{display:inline-flex;border:1px solid var(--c-border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:8px 14px;font-size:14px;color:var(--c-muted);border-right:1px solid var(--c-border)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--c-primary);color:#fff;font-weight:700}
.rep-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rep-box{border:1px solid var(--c-border);border-radius:8px;overflow:auto;max-height:440px}
.rep-title{padding:10px 12px;background:#F6F9FD;border-bottom:1px solid var(--c-border);font-size:13.5px}
.rep-title b{color:var(--c-ink)}
.note{border-left:4px solid var(--c-accent);background:#EEF8FC;padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px;margin-top:14px}
.note b{color:var(--c-ink)}
.note ul{margin:6px 0 0;padding-left:18px}
.warnline{background:var(--c-warn-bg);color:var(--c-warn);border-radius:8px;padding:9px 12px;font-size:13.5px;font-weight:700;margin-bottom:12px}

/* Paso 5: resumen */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kpi{border:1px solid var(--c-border);border-radius:10px;padding:14px 16px}
.kpi h3{font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.kpi h3 .dot{width:10px;height:10px;border-radius:50%}
.kpi .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px dashed #EEF1F5}
.kpi .row:last-child{border-bottom:none}
.kpi .row b{font-variant-numeric:tabular-nums;color:var(--c-ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px}
.panel{border:1px solid var(--c-border);border-radius:10px;padding:14px 16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:10px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:13px}
.bar .tr{background:#F0F3F7;border-radius:4px;height:22px;display:flex;overflow:hidden}
.bar .tr span{display:block;height:100%;transition:width .8s ease}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--c-ink)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--c-muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #EEF1F5;font-size:14px;flex-wrap:wrap}
.hist li:last-child{border-bottom:none}
.hist .m{font-weight:700;color:var(--c-ink);min-width:130px}
.hist .s{color:var(--c-muted);font-size:13px;flex:1;min-width:150px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.g{background:var(--c-ok-bg);color:var(--c-ok)}
.pill.b{background:var(--c-soft);color:var(--c-primary)}
.gana{margin-top:18px;background:var(--c-ink);color:#fff;border-radius:10px;padding:18px 20px}
.gana h3{color:#fff;font-size:17px;margin-bottom:8px}
.gana ul{margin:0;padding-left:20px;display:grid;gap:5px}
.gana li b{color:#7FD3F0}

footer{max-width:1180px;margin:0 auto;padding:0 20px 30px;font-size:12.5px;color:var(--c-muted);text-align:center}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--c-ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,51,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:10px;padding:20px;max-width:420px;width:100%}
.modal h3{margin-bottom:8px}
.modal .actions{border-top:none;padding-top:0;margin-top:16px;justify-content:flex-end}

@media (max-width:820px){
  .top{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .top img{height:38px}
  .top .ttl{flex:1}
  .top .ttl b{font-size:15px;line-height:1.25}
  .top .ttl span{display:none}
  .btn-ghost{padding:5px 9px;font-size:12.5px}
  .due{gap:2px 14px;font-size:13px}
  .top .sp{display:none}
  .badge-proto{order:10;width:100%;text-align:center}
  .due{padding:8px 14px}
  .steps{padding:8px 14px}
  .st .lb{display:none}
  .st.on .lb{display:inline}
  main{padding:16px 14px 30px}
  .card{padding:16px}
  .step-head h2{font-size:20px}
  .ba{grid-template-columns:minmax(0,1fr)}
  .merge{grid-template-columns:minmax(0,1fr)}
  .merge .arrow{transform:rotate(90deg)}
  .cmp,.rev,.grid2,.kpis{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:96px minmax(0,1fr) 84px}
  .actions .btn{flex:1}
}
</style>
</head>

/* ===================== utilidades ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function money(c) {
  const neg = c < 0; c = Math.abs(c);
  const ent = Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const dec = String(c % 100).padStart(2, '0');
  return (neg ? '−' : '') + '$ ' + ent + ',' + dec;
}
const ivaDe = (base) => Math.round(base * DATA.ivaPct / 100);
const pad = (n, w) => String(n).padStart(w, '0');
const SV = Object.fromEntries(DATA.servicios.map((s) => [s.cod, s]));
const CL = Object.fromEntries(DATA.clientes.map((c) => [c.c, c]));
function rng(seed) { let x = seed; return () => { x = (x * 48271) % 2147483647; return x / 2147483647; }; }
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

/* Genera las facturas limpias de un mes (lo que el proveedor factura). */
function genMes(m) {
  const r = rng(m.seed), out = [];
  [['UIO', m.uio, m.nUio], ['GYE', m.gye, m.nGye]].forEach(([sede, n, n0]) => {
    const dias = [];
    for (let i = 0; i < n; i++) dias.push(1 + Math.floor(r() * m.dias));
    dias.sort((a, b) => a - b);
    dias.forEach((d, i) => {
      const cli = pick(r, DATA.clientes);
      const lines = [{ cod: 'DES', q: 1 }];
      const pax = Math.floor(r() * 7); if (pax > 0) lines.push({ cod: 'VIP', q: pax });
      if (r() < 0.6) lines.push({ cod: 'PLA', q: 1 });
      if (r() < 0.4) lines.push({ cod: 'CAT', q: 1 });
      if (r() < 0.5) lines.push({ cod: 'TRA', q: 1 + Math.floor(r() * 3) });
      lines.forEach((l) => { l.p = SV[l.cod].p; l.art = SV[l.cod].n; });
      out.push({
        num: DATA.sedes[sede].serie + '-' + pad(n0 + i, 9), sede,
        fecha: pad(d, 2) + '/' + m.k.slice(5) + '/' + m.k.slice(0, 4),
        cli: cli.c, mat: cli.mat, tipo: pick(r, DATA.tipos), lines,
      });
    });
  });
  return out;
}
const sumLines = (ls) => ls.reduce((s, l) => s + l.q * l.p, 0);

/* Arma el archivo de octubre tal como llegaría del proveedor, con sus detalles reales:
   una matrícula vacía, un total que no cuadra, una factura repetida, una de noviembre,
   un artículo nuevo y una nota de crédito. */
function archivoOctubre() {
  const m = DATA.meses[2];
  const fs = genMes(m);
  const uio = fs.filter((f) => f.sede === 'UIO'), gye = fs.filter((f) => f.sede === 'GYE');
  const fMat = uio[4];            // sin matrícula
  const fDif = gye[2];            // total de Facturas no cuadra con Detalle
  const fDup = uio[8];            // aparece dos veces en Facturas
  const fNue = uio[10];           // trae un artículo nuevo
  const fNc = gye[5];             // tiene una nota de crédito
  if (!fDif.lines.some((l) => l.cod === 'VIP')) fDif.lines.push({ cod: 'VIP', q: 2, p: SV.VIP.p, art: SV.VIP.n });
  fNue.lines.push({ cod: DATA.nuevo.cod, q: 1, p: DATA.nuevo.p, art: DATA.nuevo.n });
  if (!fNc.lines.some((l) => l.cod === 'VIP')) fNc.lines.push({ cod: 'VIP', q: 3, p: SV.VIP.p, art: SV.VIP.n });
  // Factura emitida el 1 de noviembre que llegó en el archivo de octubre
  const cliN = DATA.clientes[1];
  const fNov = { num: DATA.sedes.UIO.serie + '-' + pad(m.nUio + m.uio, 9), sede: 'UIO', fecha: '01/11/2026', cli: cliN.c, mat: cliN.mat, tipo: 'Llegada',
    lines: [{ cod: 'DES', q: 1, p: SV.DES.p, art: SV.DES.n }, { cod: 'VIP', q: 2, p: SV.VIP.p, art: SV.VIP.n }] };
  fs.push(fNov);

  const facturas = [];
  fs.forEach((f) => {
    let sub = sumLines(f.lines);
    if (f === fDif) sub -= SV.VIP.p; // el proveedor dejó fuera un pasajero de sala VIP en la cabecera
    const row = { num: f.num, fecha: f.fecha, sede: f.sede, cli: f.cli, mat: f === fMat ? '' : f.mat, tipo: f.tipo, sub, iva: ivaDe(sub), tot: sub + ivaDe(sub) };
    facturas.push(row);
    if (f === fDup) facturas.push(Object.assign({}, row));
  });
  const detalle = [];
  fs.forEach((f) => f.lines.forEach((l) => detalle.push({ num: f.num, cod: l.cod, art: l.art, q: l.q, p: l.p, v: l.q * l.p })));
  const notas = [{ nc: '001-002-000000041', fecha: '28/10/2026', num: fNc.num, motivo: 'Pasajero no usó la sala VIP', v: SV.VIP.p }];
  return { facturas, detalle, clientes: DATA.clientes, notas, ref: { fMat: fMat.num, fDif: fDif.num, fDup: fDup.num, fNue: fNue.num, fNc: fNc.num, fNov: fNov.num } };
}

/* Archivo limpio de un mes anterior (ya entregado) */
function archivoLimpio(m) {
  const fs = genMes(m);
  return {
    facturas: fs.map((f) => { const sub = sumLines(f.lines); return { num: f.num, fecha: f.fecha, sede: f.sede, cli: f.cli, mat: f.mat, tipo: f.tipo, sub, iva: ivaDe(sub), tot: sub + ivaDe(sub) }; }),
    detalle: fs.flatMap((f) => f.lines.map((l) => ({ num: f.num, cod: l.cod, art: l.art, q: l.q, p: l.p, v: l.q * l.p }))),
    clientes: DATA.clientes, notas: [], ref: {},
  };
}

/* =====================================================================
   PROCESO: une, revisa y arma el reporte. fx = arreglos elegidos por el usuario.
   ===================================================================== */
function procesar(arch, mesK, fx) {
  fx = fx || {};
  const auto = [], avisos = [];
  // 1. Quitar repetidas
  const vistas = new Set(), facts = [];
  let dup = null;
  arch.facturas.forEach((f) => { if (vistas.has(f.num)) { dup = f.num; return; } vistas.add(f.num); facts.push(Object.assign({}, f)); });
  // 2. Detalle por factura
  const det = {};
  arch.detalle.forEach((d) => { (det[d.num] = det[d.num] || []).push(d); });
  const ncPor = {};
  arch.notas.forEach((n) => { ncPor[n.num] = (ncPor[n.num] || 0) + n.v; });

  auto.push({ t: 'Se unieron las ' + 4 + ' pestañas del archivo en una sola tabla.' });
  auto.push({ t: arch.detalle.length + ' filas de Detalle (una por artículo) quedaron en ' + facts.length + ' filas, una por factura.' });
  auto.push({ t: 'Cada factura se cruzó con su operador usando la pestaña Clientes.' });
  if (dup) auto.push({ t: 'La factura ' + dup + ' aparecía dos veces. Se contó una sola vez.' });
  arch.notas.forEach((n) => auto.push({ t: 'Se descontó la nota de crédito ' + n.nc + ' (' + money(n.v) + ') de la factura ' + n.num + '.' }));

  const mesMM = mesK.slice(5), mesYY = mesK.slice(0, 4);
  const filas = [];
  facts.forEach((f) => {
    const ls = det[f.num] || [];
    const sumaDet = ls.reduce((s, l) => s + l.v, 0);
    const cols = {}; DATA.servicios.forEach((s) => (cols[s.cod] = 0));
    let otros = 0, sinCol = 0;
    ls.forEach((l) => { if (SV[l.cod]) cols[l.cod] += l.v; else if (fx.art === 'otros') otros += l.v; else sinCol += l.v; });
    const fueraMes = !(f.fecha.slice(3, 5) === mesMM && f.fecha.slice(6) === mesYY);
    const row = { f, cols, otros, sinCol, nc: ncPor[f.num] || 0, sumaDet, fueraMes, flags: {} };
    // avisos
    if (!f.mat) {
      const ok = fx.mat && fx.mat.trim();
      avisos.push({ id: 'mat', num: f.num, ok: !!ok, sug: CL[f.cli].mat, cli: CL[f.cli].n, val: ok ? fx.mat.trim().toUpperCase() : '' });
      if (ok) f.mat = fx.mat.trim().toUpperCase(); else row.flags.mat = true;
    }
    if (f.sub !== sumaDet) {
      avisos.push({ id: 'dif', num: f.num, ok: fx.dif === 'detalle', pend: fx.dif === 'consultar', fact: f.sub, det: sumaDet });
      if (fx.dif === 'detalle') { f.sub = sumaDet; f.iva = ivaDe(sumaDet); f.tot = f.sub + f.iva; } else row.flags.dif = true;
    }
    if (fueraMes) {
      avisos.push({ id: 'fecha', num: f.num, fecha: f.fecha, ok: fx.fecha === 'nov' || fx.fecha === 'incluir', eleccion: fx.fecha });
      if (fx.fecha === 'nov') return; // queda para el mes siguiente
      if (fx.fecha !== 'incluir') row.flags.fecha = true;
    }
    if (ls.some((l) => !SV[l.cod])) {
      const l = ls.find((x) => !SV[x.cod]);
      avisos.push({ id: 'art', num: f.num, art: l.art, cod: l.cod, v: l.v, ok: fx.art === 'otros' });
      if (fx.art !== 'otros') row.flags.art = true;
    }
    row.base = DATA.servicios.reduce((s, sv) => s + cols[sv.cod], 0) + otros - row.nc;
    row.iva = ivaDe(row.base);
    row.total = row.base + row.iva;
    filas.push(row);
  });
  const diferidas = facts.filter((f) => fx.fecha === 'nov' && !(f.fecha.slice(3, 5) === mesMM && f.fecha.slice(6) === mesYY));
  filas.sort((a, b) => (a.f.sede < b.f.sede ? 1 : a.f.sede > b.f.sede ? -1 : 0) || a.f.fecha.split('/').reverse().join('').localeCompare(b.f.fecha.split('/').reverse().join('')) || a.f.num.localeCompare(b.f.num));
  // Cuadre por sede: lo que dicen las cabeceras de Facturas (menos notas de crédito) frente a lo que suma el reporte
  const cuadre = {};
  Object.keys(DATA.sedes).forEach((s) => {
    const fs = filas.filter((r) => r.f.sede === s);
    const A = fs.reduce((t, r) => t + r.f.sub - r.nc, 0);
    const B = fs.reduce((t, r) => t + r.base, 0);
    cuadre[s] = { A, B, d: A - B, n: fs.length };
  });
  return { auto, avisos, filas, cuadre, diferidas, usaOtros: fx.art === 'otros' };
}

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' + cols + '<sheetData>' + rows + '</sheetData></worksheet>';
}
function libro(hojas) {
  const files = [];
  files.push({ name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    hojas.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>' });
  files.push({ name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
  files.push({ name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    hojas.map((s, i) => '<sheet name="' + xesc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>' });
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    hojas.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
    '<Relationship Id="rId' + (hojas.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' });
  files.push({ name: 'xl/styles.xml', data: XST });
  hojas.forEach((s, i) => files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXML(s) }));
  return zipStore(files);
}
const usd = (c) => Math.round(c) / 100;
function hojaReporte(p, sede, mesN) {
  const conSede = sede === 'AMB';
  const rs = filasDe(p, sede), cols = columnasReporte(p.usaOtros, conSede), nTxt = conSede ? 6 : 5, t = totalesDe(rs);
  const rows = [];
  rows.push([{ v: 'REPORTE DE VENTAS · ' + (conSede ? 'QUITO Y GUAYAQUIL' : DATA.sedes[sede].aer.toUpperCase()) + ' · ' + mesN.toUpperCase(), s: 3 }]);
  rows.push([{ v: 'Ecuacentair Cia Ltda · Prototipo con datos ilustrativos · columnas de ejemplo, se ajustan al formato del aeropuerto', s: 6 }]);
  rows.push([]);
  rows.push(cols.map((c) => ({ v: c, s: 1 })));
  rs.forEach((r) => {
    const m = (f) => (f ? 7 : 0), mm = (f) => (f ? 8 : 2);
    rows.push((conSede ? [DATA.sedes[r.f.sede].n] : []).concat([{ v: r.f.fecha, s: m(r.flags.fecha) }, r.f.num, CL[r.f.cli].n, { v: r.f.mat || 'FALTA', s: m(r.flags.mat) }, r.f.tipo],
      DATA.servicios.map((s) => ({ v: usd(r.cols[s.cod]), s: 2 })), p.usaOtros ? [{ v: usd(r.otros), s: 2 }] : [],
      [{ v: usd(-r.nc), s: 2 }, { v: usd(r.base), s: mm(r.flags.dif || r.flags.art) }, { v: usd(r.iva), s: 2 }, { v: usd(r.total), s: 2 }]));
  });
  const tr = [{ v: 'TOTAL', s: 4 }]; for (let i = 1; i < nTxt; i++) tr.push({ v: ' ', s: 4 });
  rows.push(tr.concat(DATA.servicios.map((s) => ({ v: usd(t.cols[s.cod]), s: 5 })), p.usaOtros ? [{ v: usd(t.otros), s: 5 }] : [], [{ v: usd(-t.nc), s: 5 }, { v: usd(t.base), s: 5 }, { v: usd(t.iva), s: 5 }, { v: usd(t.total), s: 5 }]));
  const widths = (conSede ? [11] : []).concat([11, 20, 13, 11, 15], DATA.servicios.map(() => 12), p.usaOtros ? [14] : [], [14, 14, 11, 12]);
  return { name: conSede ? 'Ambas sedes' : DATA.sedes[sede].n, widths, rows };
}
function descargar(bytes, nombre) {
  try {
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Descargado: ' + nombre);
  } catch (e) { toast('No se pudo descargar el archivo en este navegador.'); }
}
function bajarReporte(p, mesN, mesK, sedes) {
  descargar(libro(sedes.map((s) => hojaReporte(p, s, mesN))), 'Reporte_ventas_aeropuerto_' + (sedes.length === 1 ? DATA.sedes[sedes[0]] ? DATA.sedes[sedes[0]].n : 'Ambas' : 'Quito_Guayaquil') + '_' + mesK + '.xlsx');
}
function bajarOrigen() {
  const hojas = Object.keys(HOJAS).map((k) => {
    const h = HOJAS[k];
    const raw = k === 'Facturas' ? ARCH.facturas.map((f) => [f.num, f.fecha, f.sede, f.cli, f.mat, f.tipo, usd(f.sub), usd(f.iva), usd(f.tot)])
      : k === 'Detalle' ? ARCH.detalle.map((d) => [d.num, d.cod, d.art, d.q, usd(d.p), usd(d.v)])
      : k === 'Clientes' ? ARCH.clientes.map((c) => [c.c, c.n, c.pais])
      : ARCH.notas.map((n) => [n.nc, n.fecha, n.num, n.motivo, usd(n.v)]);
    return { name: k, widths: h.cols.map(() => 16), rows: [h.cols.map((c) => ({ v: c, s: 1 }))].concat(raw.map((r) => r.map((c, i) => (h.num.includes(i) && typeof c === 'number' && !(k === 'Detalle' && i === 3) ? { v: c, s: 2 } : c)))) };
  });
  descargar(libro(hojas), DATA.archivo);
}

/* ===================== eventos ===================== */
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go && !go.disabled) { const n = +go.dataset.go; if (puede(n)) { S.step = n; render(); window.scrollTo(0, 0); } return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const sd = e.target.closest('[data-sede]');
  if (sd) { S.sede = sd.dataset.sede; render(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'cargar') { S.cargado = true; render('hoja'); toast('Archivo cargado: 4 pestañas reconocidas'); }
  else if (a === 'bajarOrigen') bajarOrigen();
  else if (a === 'ir2') { S.step = 2; render(); window.scrollTo(0, 0); }
  else if (a === 'unir') {
    const m = $('#merge'); if (m) m.classList.add('merged');
    b.disabled = true; b.textContent = 'Uniendo…';
    setTimeout(() => { S.unido = true; render('merge'); }, 900);
  }
  else if (a === 'ir3') { S.step = 3; render(); window.scrollTo(0, 0); }
  else if (a === 'ir4') { S.step = 4; render(); window.scrollTo(0, 0); }
  else if (a === 'ir5') { S.step = 5; S.guardado = true; render(); window.scrollTo(0, 0); }
  else if (a === 'mat') { const v = ($('#inMat') || {}).value || ''; if (!v.trim()) { toast('Escriba la matrícula'); return; } S.fx.mat = v; render('avisos'); }
  else if (a === 'matSug') { S.fx.mat = b.dataset.v; render('avisos'); }
  else if (a === 'difDet') { S.fx.dif = 'detalle'; render('avisos'); }
  else if (a === 'difCon') { S.fx.dif = 'consultar'; render('avisos'); toast('Marcada para consultar al proveedor'); }
  else if (a === 'fechaNov') { S.fx.fecha = 'nov'; render('avisos'); }
  else if (a === 'fechaInc') { S.fx.fecha = 'incluir'; render('avisos'); }
  else if (a === 'artOtros') { S.fx.art = 'otros'; render('avisos'); }
  else if (a === 'bajarRep') bajarReporte(P(), DATA.meses[2].n, DATA.mesActual, [S.sede]);
  else if (a === 'bajarMes') {
    const m = b.dataset.m;
    if (m === 'nov') {
      const p = P();
      const archN = { facturas: ARCH.facturas.filter((f) => p.diferidas.some((d) => d.num === f.num)), detalle: ARCH.detalle.filter((d) => p.diferidas.some((x) => x.num === d.num)), clientes: DATA.clientes, notas: [] };
      bajarReporte(procesar(archN, '2026-11', {}), 'Noviembre 2026 (avance)', '2026-11', ['UIO', 'GYE']);
    } else if (m === '2') bajarReporte(P(), DATA.meses[2].n, DATA.mesActual, ['UIO', 'GYE']);
    else { const x = PREV[+m]; bajarReporte(procesar(x.arch, x.m.k, {}), x.m.n, x.m.k, ['UIO', 'GYE']); }
  }
  else if (a === 'reiniciar') reiniciar();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'inMat') { e.preventDefault(); $('[data-act="mat"]').click(); } });
function reiniciar() {
  confirmar('¿Volver a empezar?', '<p class="hint">Se borra lo que hizo en este prototipo y vuelve al paso 1.</p>', () => { S = S0(); render(); window.scrollTo(0, 0); });
}
$('#btnReset').addEventListener('click', reiniciar);
render();
</script>
